name: Check public sports data providers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check historical team results and NBA player observations
        run: node scripts/check-sports.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-provider-results
          path: sports-provider-results.json
